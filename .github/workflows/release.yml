# Release the npm package and create the matching GitHub release.
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: "Release"

run-name: "${{ github.event_name == 'workflow_dispatch' && format('Manual release ({0}) by @{1}', inputs.version || inputs.release_type, github.actor) || format('Tagged release {0} by @{1}', github.ref_name, github.actor) }}"

concurrency:
    group: "${{ github.workflow }}-${{ github.repository }}"
    cancel-in-progress: "${{ !startsWith(github.ref, 'refs/tags/v') }}"

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            release_type:
                description: "Release bump type"
                required: true
                default: "patch"
                type: "choice"
                options:
                    - "patch"
                    - "minor"
                    - "major"
            version:
                description: "Explicit release version in x.y.z format (overrides release_type)"
                required: false
                type: "string"

defaults:
    run:
        shell: "bash"

jobs:
    publish:
        name: "Publish npm package and GitHub release"
        if: "${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}"
        runs-on: "ubuntu-latest"
        timeout-minutes: 60
        outputs:
            package_name: "${{ steps.version.outputs.package_name }}"
            version: "${{ steps.version.outputs.version }}"
            tag: "${{ steps.version.outputs.tag }}"
            npm_release_url: "${{ steps.version.outputs.npm_release_url }}"
            github_release_url: "${{ steps.version.outputs.github_release_url }}"
        permissions:
            contents: "write"
            id-token: "write"
        env:
            CI: "true"
            DEFAULT_RELEASE_BRANCH: "main"
            NPM_REGISTRY_URL: "https://registry.npmjs.org"
            RELEASE_NOTES_PATH: "temp/release-notes.md"
            RELEASE_ASSETS_DIR: "temp/release-assets"
        concurrency:
            group: "release-pipeline"
            cancel-in-progress: false

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Resolve target ref"
              id: "target_ref"
              run: |
                  set -euo pipefail
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    {
                      echo "ref=${DEFAULT_RELEASE_BRANCH}"
                      echo "branch=${DEFAULT_RELEASE_BRANCH}"
                    } >> "$GITHUB_OUTPUT"
                  else
                    {
                      echo "ref=${GITHUB_REF}"
                      echo "branch=${GITHUB_REF_NAME}"
                    } >> "$GITHUB_OUTPUT"
                  fi

            - name: "Checkout repository"
              uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
              with:
                  fetch-depth: 0
                  fetch-tags: true
                  ref: "${{ steps.target_ref.outputs.ref }}"
                  token: "${{ secrets.GITHUB_TOKEN }}"

            - name: "Verify exact release source"
              id: "source"
              env:
                  BRANCH: "${{ steps.target_ref.outputs.branch }}"
              run: |
                  set -euo pipefail
                  git fetch --no-tags origin "refs/heads/${DEFAULT_RELEASE_BRANCH}"

                  source_sha=$(git rev-parse HEAD)
                  remote_main_sha=$(git rev-parse FETCH_HEAD)
                  if [ "$source_sha" != "$remote_main_sha" ]; then
                    echo "Release source ${source_sha} is not exact ${DEFAULT_RELEASE_BRANCH} (${remote_main_sha})." >&2
                    exit 1
                  fi

                  if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$BRANCH" != "$DEFAULT_RELEASE_BRANCH" ]; then
                    echo "Manual releases must target ${DEFAULT_RELEASE_BRANCH}; received ${BRANCH}." >&2
                    exit 1
                  fi

                  if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
                    echo "Release checkout is not clean before dependency installation." >&2
                    git status --short
                    exit 1
                  fi

                  {
                    echo "sha=$source_sha"
                    echo "remote_main_sha=$remote_main_sha"
                  } >> "$GITHUB_OUTPUT"

            - name: "Setup Node.js"
              uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              with:
                  node-version-file: ".node-version"

            - name: "Install declared npm version"
              working-directory: "${{ runner.temp }}"
              run: |
                  npm_version=$(node -p "require(process.env.GITHUB_WORKSPACE + '/package.json').packageManager.split('@').at(-1)")
                  npm install --global "npm@${npm_version}"
                  test "$(npm --version)" = "$npm_version"

            - name: "Configure npm cache and registry"
              uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              with:
                  node-version-file: ".node-version"
                  registry-url: "${{ env.NPM_REGISTRY_URL }}"
                  cache: "npm"
                  cache-dependency-path: "package-lock.json"

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Configure Git for release automation"
              if: "github.event_name == 'workflow_dispatch'"
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git fetch --tags

            - name: "Validate workflow_dispatch release input"
              if: "github.event_name == 'workflow_dispatch'"
              env:
                  EXPLICIT_VERSION: "${{ inputs.version }}"
                  RELEASE_TYPE: "${{ inputs.release_type }}"
              run: |
                  set -euo pipefail
                  explicit_version="${EXPLICIT_VERSION:-}"
                  if [ -n "$explicit_version" ]; then
                    if [[ ! "$explicit_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "Invalid version input '$explicit_version'. Use x.y.z format." >&2
                      exit 1
                    fi
                    exit 0
                  fi

                  release_type="${RELEASE_TYPE:-patch}"
                  case "$release_type" in
                    patch|minor|major)
                      exit 0
                      ;;
                    *)
                      echo "Invalid release_type '$release_type'. Allowed: patch, minor, major." >&2
                      exit 1
                      ;;
                  esac

            - name: "Validate tag matches package version"
              if: "startsWith(github.ref, 'refs/tags/v')"
              run: |
                  TAG_VERSION="${GITHUB_REF_NAME#v}"
                  PACKAGE_VERSION=$(node -p "require('./package.json').version")
                  if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
                    echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)."
                    exit 1
                  fi

            - name: "Verify package"
              run: "npm run release:check"

            - name: "Ensure verification did not modify tracked files"
              run: |
                  set -euo pipefail
                  if [ -n "$(git status --porcelain=v1 --untracked-files=all)" ]; then
                    echo "release:check modified the release checkout." >&2
                    git status --short
                    exit 1
                  fi

            - name: "Determine release version"
              id: "version"
              env:
                  EXPLICIT_VERSION: "${{ inputs.version }}"
                  RELEASE_TYPE: "${{ inputs.release_type }}"
              run: |
                  set -euo pipefail

                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    explicit_version="${EXPLICIT_VERSION:-}"
                    if [ -n "$explicit_version" ]; then
                      npm version "$explicit_version" --no-git-tag-version
                      version="$explicit_version"
                    else
                      release_type="${RELEASE_TYPE:-patch}"
                      npm version "$release_type" --no-git-tag-version
                      version=$(node -p "require('./package.json').version")
                    fi
                  else
                    tag="${GITHUB_REF_NAME}"
                    version="${tag#v}"
                  fi

                  package_name=$(node -p "require('./package.json').name")
                  tag="v${version}"
                  npm_release_url="https://www.npmjs.com/package/${package_name}/v/${version}"
                  github_release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}"

                  {
                    echo "version=$version"
                    echo "tag=$tag"
                    echo "package_name=$package_name"
                    echo "npm_release_url=$npm_release_url"
                    echo "github_release_url=$github_release_url"
                  } >> "$GITHUB_OUTPUT"

            - name: "Rebuild package after manual version bump"
              if: "github.event_name == 'workflow_dispatch'"
              run: "npm run build"

            - name: "Validate manual release mutation boundary"
              if: "github.event_name == 'workflow_dispatch'"
              run: |
                  set -euo pipefail
                  if ! git diff --cached --quiet; then
                    echo "The index must remain empty before the release allowlist is staged." >&2
                    git diff --cached --name-status
                    exit 1
                  fi

                  if [ -n "$(git ls-files --others --exclude-standard)" ]; then
                    echo "The version/build steps created unexpected untracked files." >&2
                    git ls-files --others --exclude-standard
                    exit 1
                  fi

                  expected_paths=$(printf '%s\n' package-lock.json package.json)
                  actual_paths=$(git diff --name-only | LC_ALL=C sort)
                  if [ "$actual_paths" != "$expected_paths" ]; then
                    echo "Expected only package.json and package-lock.json to change during versioning." >&2
                    git status --short
                    exit 1
                  fi

            - name: "Check whether version is already published"
              id: "npm_check"
              env:
                  PACKAGE_NAME: "${{ steps.version.outputs.package_name }}"
                  VERSION: "${{ steps.version.outputs.version }}"
              run: |
                  set -euo pipefail
                  mkdir -p temp
                  set +e
                  npm view "${PACKAGE_NAME}@${VERSION}" version --json > temp/npm-version.json 2> temp/npm-version-error.log
                  npm_view_exit=$?
                  set -e

                  if [ "$npm_view_exit" -eq 0 ]; then
                    echo "already_published=true" >> "$GITHUB_OUTPUT"
                    echo "Version ${VERSION} is already published to npm."
                  elif grep -q 'E404' temp/npm-version-error.log; then
                    echo "already_published=false" >> "$GITHUB_OUTPUT"
                    echo "Version ${VERSION} is available for publishing."
                  else
                    echo "Unable to determine whether ${PACKAGE_NAME}@${VERSION} exists." >&2
                    cat temp/npm-version-error.log >&2
                    exit "$npm_view_exit"
                  fi

            - name: "Prevent duplicate workflow_dispatch release version"
              if: "github.event_name == 'workflow_dispatch' && steps.npm_check.outputs.already_published == 'true'"
              env:
                  VERSION: "${{ steps.version.outputs.version }}"
              run: |
                  echo "Version ${VERSION} is already published. Choose a new release type/version." >&2
                  exit 1

            - name: "Preflight immutable release identities"
              env:
                  TAG: "${{ steps.version.outputs.tag }}"
                  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
              run: |
                  set -euo pipefail

                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    if git show-ref --verify --quiet "refs/tags/${TAG}"; then
                      echo "Tag ${TAG} already exists locally." >&2
                      exit 1
                    fi

                    if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
                      echo "Tag ${TAG} already exists on origin." >&2
                      exit 1
                    fi
                  fi

                  mkdir -p temp
                  gh release list --limit 1000 --json tagName > temp/release-preflight.json
                  if TAG="$TAG" node -e "const releases = require('./temp/release-preflight.json'); process.exit(releases.some(({ tagName }) => tagName === process.env.TAG) ? 0 : 1);"; then
                    echo "GitHub release ${TAG} already exists." >&2
                    exit 1
                  fi

            - name: "Commit and push release version + tag"
              if: "github.event_name == 'workflow_dispatch'"
              env:
                  BRANCH: "${{ steps.target_ref.outputs.branch }}"
                  SOURCE_SHA: "${{ steps.source.outputs.sha }}"
                  TAG: "${{ steps.version.outputs.tag }}"
              run: |
                  set -euo pipefail

                  remote_branch_sha=$(git ls-remote --heads origin "refs/heads/${BRANCH}" | awk '{print $1}')
                  if [ "$remote_branch_sha" != "$SOURCE_SHA" ]; then
                    echo "Branch ${BRANCH} moved from ${SOURCE_SHA} to ${remote_branch_sha}; aborting release." >&2
                    exit 1
                  fi

                  git add -- package.json package-lock.json
                  if git diff --cached --quiet; then
                    echo "No staged changes found for release commit." >&2
                    exit 1
                  fi

                  expected_paths=$(printf '%s\n' package-lock.json package.json)
                  staged_paths=$(git diff --cached --name-only | LC_ALL=C sort)
                  if [ "$staged_paths" != "$expected_paths" ]; then
                    echo "The staged release mutation does not match the explicit allowlist." >&2
                    git diff --cached --name-status
                    exit 1
                  fi

                  if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
                    echo "Unexpected unstaged or untracked changes remain after staging the release allowlist." >&2
                    git status --short
                    exit 1
                  fi

                  git commit -m "🔖 [chore] (release) Publish ${TAG}"
                  if [ "$(git rev-parse HEAD^)" != "$SOURCE_SHA" ]; then
                    echo "Release commit parent does not match the verified source SHA ${SOURCE_SHA}." >&2
                    exit 1
                  fi

                  git tag -a "$TAG" -m "$TAG"
                  git push --atomic origin "HEAD:refs/heads/${BRANCH}" "refs/tags/${TAG}"

                  published_branch_sha=$(git ls-remote --heads origin "refs/heads/${BRANCH}" | awk '{print $1}')
                  published_tag_sha=$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | awk '{print $1}')
                  release_sha=$(git rev-parse HEAD)
                  if [ "$published_branch_sha" != "$release_sha" ] || [ "$published_tag_sha" != "$release_sha" ]; then
                    echo "Atomic push verification failed for ${TAG} at ${release_sha}." >&2
                    exit 1
                  fi

            - name: "Generate release notes from git-cliff"
              env:
                  EXPECTED_TAG: "${{ steps.version.outputs.tag }}"
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
              run: |
                  set -euo pipefail

                  if [ -z "$EXPECTED_TAG" ]; then
                    echo "::error::The release version step did not provide an expected tag."
                    exit 1
                  fi

                  tag_ref="refs/tags/${EXPECTED_TAG}"
                  if ! git show-ref --verify --quiet "$tag_ref"; then
                    echo "::error::Expected local tag ${EXPECTED_TAG} does not exist."
                    exit 1
                  fi

                  tag_commit=$(git rev-parse "${tag_ref}^{commit}")
                  head_commit=$(git rev-parse HEAD)
                  if [ "$tag_commit" != "$head_commit" ]; then
                    echo "::error::Tag ${EXPECTED_TAG} points to ${tag_commit}, but HEAD is ${head_commit}."
                    exit 1
                  fi

                  head_tags=$(git tag --points-at HEAD --sort=refname)
                  if [ "$head_tags" != "$EXPECTED_TAG" ]; then
                    displayed_head_tags=${head_tags//$'\n'/, }
                    if [ -z "$displayed_head_tags" ]; then
                      displayed_head_tags="(none)"
                    fi
                    echo "::error::Expected ${EXPECTED_TAG} to be the only tag at HEAD, but found: ${displayed_head_tags}."
                    exit 1
                  fi

                  mkdir -p temp
                  npm run --silent changelog:release-notes -- --output "${RELEASE_NOTES_PATH}"
                  if [ ! -s "${RELEASE_NOTES_PATH}" ]; then
                    echo "No release notes were generated by git-cliff." > "${RELEASE_NOTES_PATH}"
                  fi

            - name: "Publish to npm"
              if: "steps.npm_check.outputs.already_published != 'true'"
              run: "npm publish --access public --provenance --ignore-scripts"

            - name: "Create release archives"
              id: "release_assets"
              env:
                  PACKAGE_NAME: "${{ steps.version.outputs.package_name }}"
                  VERSION: "${{ steps.version.outputs.version }}"
              run: |
                  set -euo pipefail

                  assets_dir="${RELEASE_ASSETS_DIR}"
                  unpack_dir="temp/release-package"
                  pack_metadata_path="${assets_dir}/npm-pack.json"
                  mkdir -p "$assets_dir"
                  rm -rf "$unpack_dir"

                  npm pack --json --pack-destination "$assets_dir" > "$pack_metadata_path"

                  tarball_filename=$(
                    node scripts/read-npm-pack-filename.mjs "$pack_metadata_path"
                  )
                  tarball_path="${assets_dir}/${tarball_filename}"
                  safe_package_name=$(printf '%s' "$PACKAGE_NAME" | sed 's/^@//; s#/#-#g')
                  zip_basename="${safe_package_name}-${VERSION}"

                  mkdir -p "$unpack_dir"
                  tar -xzf "$tarball_path" -C "$unpack_dir"
                  mv "$unpack_dir/package" "$unpack_dir/${zip_basename}"

                  (
                    cd "$unpack_dir"
                    zip -rq "../release-assets/${zip_basename}.zip" "${zip_basename}"
                  )

                  {
                    echo "tarball_path=$tarball_path"
                    echo "zip_path=${assets_dir}/${zip_basename}.zip"
                    echo "tarball_name=$tarball_filename"
                    echo "zip_name=${zip_basename}.zip"
                  } >> "$GITHUB_OUTPUT"

            - name: "Create GitHub release"
              uses: "softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b" # v3.0.1
              with:
                  tag_name: "${{ steps.version.outputs.tag }}"
                  name: "${{ steps.version.outputs.tag }}"
                  body_path: "${{ env.RELEASE_NOTES_PATH }}"
                  draft: false
                  files: |
                      ${{ steps.release_assets.outputs.tarball_path }}
                      ${{ steps.release_assets.outputs.zip_path }}
                  fail_on_unmatched_files: true
                  generate_release_notes: false
                  overwrite_files: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

            - name: "Release summary"
              if: "${{ !cancelled() }}"
              run: |
                  {
                    echo "## 🚀 Release Summary"
                    echo ""
                    echo "- Event: \`${{ github.event_name }}\`"
                    echo "- Actor: @${{ github.actor }}"
                    echo "- Ref: \`${{ steps.target_ref.outputs.ref }}\`"
                    echo "- Source branch: \`${{ steps.target_ref.outputs.branch }}\`"
                    echo "- Package: \`${{ steps.version.outputs.package_name }}\`"
                    echo "- Version: \`${{ steps.version.outputs.version }}\`"
                    echo "- Tag: \`${{ steps.version.outputs.tag }}\`"
                    echo "- Already published on npm: \`${{ steps.npm_check.outputs.already_published }}\`"
                    echo "- npm package: [${{ steps.version.outputs.package_name }}@${{ steps.version.outputs.version }}](${{ steps.version.outputs.npm_release_url }})"
                    echo "- GitHub release: [${{ steps.version.outputs.tag }}](${{ steps.version.outputs.github_release_url }})"
                    echo "- Release assets: \`${{ steps.release_assets.outputs.tarball_name }}\`, \`${{ steps.release_assets.outputs.zip_name }}\`"
                  } >> "$GITHUB_STEP_SUMMARY"
